name: newAdventurePlugin
version: 1.0.0
main: fr.loual.newadventure.NewAdventurePlugin
api-version: '1.21.6'
description: Plugin d'aventure global combinant Classes, Métiers et Minéraux (Cuprite).
author: Loual

commands:
  class:
    description: Commandes de gestion des classes
    usage: /class [choose|reset|get|set|info|help]
    aliases: [classes]
  job:
    description: Commandes de gestion des métiers et missions
    usage: /job [choose|reset|info|set]
    aliases: [jobs, metier, metiers]
  cuprite:
    description: Commande principale pour gerer la Cuprite
    usage: /cuprite [give|reload|help]
    aliases: [customminerals]
    permission: customminerals.admin
  nv:
    description: Activer ou desactiver la Vision Nocturne (Mineur)
    usage: /nv
    aliases: [nightvision]

permissions:
  customminerals.admin:
    description: Permet d'administrer les minéraux personnalisés (Cuprite)
    default: op
